name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.19'
            otp: '28'
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # `:zig` tests (mob_nif.zig built for Android, MOB-226) need the pinned
      # Zig; read it from .tool-versions so CI can't drift from it.
      - name: Zig version from .tool-versions
        id: zig
        run: echo "version=$(awk '$1 == "zig" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          # A cached .zig-cache holds configure results that name the zig
          # binary by its absolute path, which changes every run.
          use-cache: false

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: erlfmt check (src/)
        # erlfmt is `only: :dev` in mix.exs, so the test-env dep tree
        # doesn't include it. Override MIX_ENV for just this step instead
        # of broadening the dep's `only:` (keeps the test env minimal).
        env:
          MIX_ENV: dev
        run: |
          mix deps.get
          mix erlfmt --check src/

      - name: Tests
        run: mix test

  native_lint:
    name: Native formatters (clang-format + swiftlint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: clang-format (iOS Objective-C + Android JNI headers)
        # xcrun ships clang-format with the Xcode CLT, which the macos-15
        # runner already has — no install step.
        run: |
          xcrun clang-format --dry-run -Werror \
            ios/mob_nif.m \
            ios/mob_beam.m \
            ios/mob_dist_port.h \
            ios/mob_dist_cookie.h \
            ios/mob_stored_queue.h \
            ios/mob_init_args.h \
            ios/mob_node_host.h \
            ios/mob_code_versions.h \
            ios/mob_erts_dir.h \
            test/native/dist_port_test.c \
            test/native/dist_cookie_test.c \
            test/native/stored_queue_test.c \
            test/native/init_args_test.c \
            test/native/node_host_test.c \
            test/native/code_versions_test.c \
            test/native/erts_dir_test.c \
            android/jni/mob_beam.h

      - name: Zig version from .tool-versions
        id: zig
        run: echo "version=$(awk '$1 == "zig" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig.outputs.version }}
          # A cached .zig-cache holds configure results that name the zig
          # binary by its absolute path, which changes every run.
          use-cache: false

      - name: Android Zig unit tests (every file with `test` blocks)
        run: |
          files=$(grep -lE '^\s*test( "|\s*\{)' android/jni/*.zig)
          [ -n "$files" ] || { echo "no Zig test files found"; exit 1; }
          for f in $files; do
            echo "== zig test $f"
            zig test "$f"
          done

      - name: Native harness (frame registry MOB-102/MOB-103, dist port MOB-139, dist cookie MOB-348, stored queue MOB-379, init args MOB-406, node host MOB-428, code versions MOB-408, ERTS dir MOB-493)
        # The frame-registry check is the only automated guard on the
        # element-frame registry's ownership, generation-gating and purge rules.
        # It reproduces the algorithm rather than linking ios/mob_nif.m (which
        # needs UIKit + the swiftc-generated header), so it can drift — running
        # it in CI is what keeps the copy honest. The dist-port, dist-cookie,
        # stored-queue, init-args, node-host and code-versions checks compile
        # ios/mob_dist_port.h, ios/mob_dist_cookie.h, ios/mob_stored_queue.h,
        # ios/mob_init_args.h, ios/mob_node_host.h and ios/mob_code_versions.h
        # themselves. Same toolchain as the clang-format step.
        run: make -C test/native run

      - name: Install Erlang (erl_nif.h for the iOS NIF compile)
        run: brew install erlang

      - name: iOS NIF compiles in debug and release (MOB-504)
        # mob 0.9.26 shipped a release nif_funcs entry for a function defined
        # only in debug builds. Only compiling the release variant catches that.
        run: make -C test/native ios-nif

      - name: Install swiftlint
        run: brew install swiftlint

      - name: swiftlint
        # swiftlint emits warnings for some pre-existing patterns
        # (force_cast in MobRootView.swift). Treat the run as
        # informational until those are triaged; flip to --strict later.
        continue-on-error: true
        run: swiftlint lint --reporter github-actions-logging ios/

  security_scan:
    name: Security scan (mix_audit + osv-scanner)
    needs: test
    runs-on: ubuntu-latest
    if: always()
    # Informational: a finding shouldn't block the workflow gate while we
    # establish a baseline. Flip to fail-on-vuln once we've triaged what's
    # already in the dep tree.
    continue-on-error: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19'
          otp-version: '28'

      - name: Cache deps + _build (reuse test job's key)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-1.19-28-${{ hashFiles('**/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-1.19-28-

      - run: mix deps.get
      - run: mix deps.compile

      # mix_audit scans mix.lock against the Erlef advisory feed. The
      # `app.start +` prefix is load-bearing: plain `mix deps.audit` fails
      # with `YamlElixir.read_from_file/1 is undefined` because mix_audit
      # doesn't ensure_all_started yaml_elixir on its own; app.start
      # starts the host app and yaml_elixir gets pulled in transitively.
      - name: Audit deps
        run: mix do app.start + deps.audit

      # osv-scanner reads OSV.dev, which carries EEF/GHSA advisories mix_audit's
      # feed lags on (decimal EEF-CVE-2026-97853 was invisible to mix_audit on
      # 2026-10-22; MOB-496). Runs even when mix_audit fails; exits 1 on any
      # finding, which marks this informational job red.
      - name: Install osv-scanner
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: osv-scanner (mix.lock)
        if: ${{ !cancelled() }}
        run: osv-scanner scan -L mix.lock:mix.lock
